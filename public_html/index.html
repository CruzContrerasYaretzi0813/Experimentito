<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Calificaciones</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    
    <script src="script.js"></script>

    <div class="contenedor">

        <h1>Sistema de Calificaciones</h1>

        <p>Captura las calificaciones del alumno</p>

        <div class="formulario">

            <label for="nombre">Nombre del alumno:</label>
            <input type="text" id="nombre" placeholder="Escribe el nombre" onkeypress="return soloLetras(event)">
            
            <label for="nombre">Edad del alumno:</label>
            <input type="number" id="edad" placeholder="Escribe la edad" min="0" max="10">

            <label for="calificacion1">Calificación 1:</label>
            <input type="number" id="calificacion1" min="0" max="10">

            <label for="calificacion2">Calificación 2:</label>
            <input type="number" id="calificacion2" min="0" max="10">

            <label for="calificacion3">Calificación 3:</label>
            <input type="number" id="calificacion3" min="0" max="10">
            
            <label for="calificacion3">Calificación 4:</label>
            <input type="number" id="calificacion4" min="0" max="10">

            <button onclick="calcularPromedio()">
                Calcular promedio
            </button>
            
            <button onclick="limpiarDatos()">
                Limpiar datos
            </button>
            
            <button onclick="agregarAlumno()">
                Agregar Alumno
            </button>
            
            <button onclick="mostrarAlumno()">
                Mostrar Alumnos
            </button>

        </div>


        <div id="resultado" class="resultado">

        </div>

    </div>

    

</body>

</html>
